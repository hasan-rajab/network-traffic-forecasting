seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  n_cells: 30
  resample_freq: 1h
  short_gap_limit: 2
  target: internet
  timezone: Europe/Rome
forecast:
  horizons: [1, 24]
  folds: 4
  seasonal_lags: [24, 168]
