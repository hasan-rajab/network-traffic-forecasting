  residual_window: 168
  magnitudes: [2, 3, 5]
  types: [spike, drop, level_shift, daily_pattern_shift]
capacity:
  percentile: 0.95
holidays:
  - 2013-11-01
  - 2013-12-07
  - 2013-12-08
  - 2013-12-25
  - 2013-12-26
  - 2014-01-01
