name: bootstrap-project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply packaged project
        run: |
          base64 -d bootstrap.b64 > /tmp/project.zip
          unzip -o /tmp/project.zip -d .
          rm -f bootstrap.b64 .github/workflows/bootstrap.yml
      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement reproducible real-data pipeline"
          git push
